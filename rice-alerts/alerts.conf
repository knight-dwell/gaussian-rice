# ~/.config/rice-alerts/alerts.conf: battery + temperature notifications.
# Read every check (no restart needed). KEY=value.
CHECK_EVERY=30          # seconds between checks

# Battery (only while discharging; re-armed when you plug in)
BATTERY_LOW=20          # normal notification at/below this %
BATTERY_CRITICAL=10     # urgent notification that stays until dismissed

# CPU temperature (°C). Alert once when crossing, again only after it cooled
# 5 °C below the threshold.
TEMP_HIGH=85
TEMP_CRITICAL=95
