# ~/.tmux.conf: minimal tmux. Not auto-started; run `tmux` when you want it.
# Colors: ~/.config/theme/generated/tmux-colors.conf (follows the theme).

# prefix Ctrl+A (instead of Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on                      # click panes/windows, scroll, drag borders
set -g base-index 1                  # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10               # snappy Esc (vim)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB"
setw -g mode-keys vi                 # matches `set -o vi` in .zshrc

# splits open in the current directory; | and - are easy to remember
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-left " #S "
set -g status-left-length 20
set -g status-right " %a %d %b  %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-separator ""

source-file -q ~/.config/theme/generated/tmux-colors.conf
