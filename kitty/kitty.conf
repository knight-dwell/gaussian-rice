enable_audio_bell no

# ── [rice] Phase 4 ──────────────────────────────────────────────────────────
# Colors come from the central theme (~/.config/theme, regenerated by
# apply-theme.sh). The old color lines and theme includes above are commented.
font_family      JetBrainsMono Nerd Font
background_opacity 0.90
window_padding_width 14
shell_integration enabled
dynamic_background_opacity yes   # lets Terminal Studio change opacity live
include ~/.config/theme/generated/kitty-colors.conf

# Terminal Studio (GUI: `terminal-studio`) writes its settings here. Included
# last, so whatever you pick in the app wins over everything above.
include studio.conf

