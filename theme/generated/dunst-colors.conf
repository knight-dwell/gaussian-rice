# GENERATED by ~/.config/theme/scripts/apply-theme.sh (colors: fixed)
[global]
    font = "JetBrainsMono Nerd Font 10"
    corner_radius = 12
    frame_color = "#44474f"
    separator_color = frame
    highlight = "#adc6ff"
    progress_bar_corner_radius = 4

[urgency_low]
    background = "#1e1f25"
    foreground = "#c4c6d0"

[urgency_normal]
    background = "#282a2f"
    foreground = "#e2e2e9"

[urgency_critical]
    background = "#93000a"
    foreground = "#ffdad6"
    frame_color = "#ffb4ab"
