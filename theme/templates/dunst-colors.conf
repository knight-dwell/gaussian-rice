# GENERATED by ~/.config/theme/scripts/apply-theme.sh (colors: {{color_source}})
[global]
    font = "{{font_family}} {{font_size}}"
    corner_radius = {{radius}}
    frame_color = "{{outline_variant}}"
    separator_color = frame
    highlight = "{{primary}}"
    progress_bar_corner_radius = {{space_xs}}

[urgency_low]
    background = "{{surface_container}}"
    foreground = "{{on_surface_variant}}"

[urgency_normal]
    background = "{{surface_container_high}}"
    foreground = "{{on_surface}}"

[urgency_critical]
    background = "{{error_container}}"
    foreground = "{{on_error_container}}"
    frame_color = "{{error}}"
