# ~/.config/theme/theme.conf
# ONE place for every color source and design token used by the rice:
# eww, rofi, dunst, kitty, tmux, i3 borders, lock screen, GTK, Qt.
#
# After editing, run:   ~/.config/theme/scripts/apply-theme.sh
# (the wallpaper picker runs it for you)
#
# This file is sourced by bash: KEY=value, no spaces around "=".

# ── Color source ────────────────────────────────────────────────────────────
# wallpaper : Material You palette generated by matugen from $WALLPAPER
# fixed     : use the hand-editable palette in $FIXED_PALETTE (wallpaper ignored)
# COLOR_MODE=wallpaper   # was: pink palette from the wallpaper
COLOR_MODE=fixed

# Current wallpaper (the wallpaper picker updates this line)
WALLPAPER="/home/dark_knight/Pictures/Wallpapers/batsignal-night.png"

# matugen options (only used when COLOR_MODE=wallpaper)
#   scheme: scheme-tonal-spot (calm, default) | scheme-vibrant | scheme-expressive
#           scheme-content | scheme-fidelity | scheme-neutral | scheme-monochrome ...
MATUGEN_SCHEME=scheme-tonal-spot
#   which color to pick when an image has several: saturation | darkness | lightness | value
MATUGEN_PREFER=saturation

# Fixed palette: Material 3 dark roles as JSON {"primary": "#...", ...}.
# Generated once from seed #4285f4 (blue). Regenerate from another seed with:
#   matugen color hex "#RRGGBB" -m dark --dry-run --old-json-output --json hex \
#     | jq '.colors | map_values(.dark)' > ~/.config/theme/palettes/fixed.json
FIXED_PALETTE="$HOME/.config/theme/palettes/fixed.json"

# ── Fixed accents (same in both modes) ──────────────────────────────────────
# Window borders: terminal (kitty) red, every other window blue.
BORDER_TERMINAL="#e53935"
BORDER_WINDOW="#1e88e5"
# BORDER_WIDTH=3
BORDER_WIDTH=4   # = i3 "default_border pixel 4"

# ── Typography ──────────────────────────────────────────────────────────────
FONT_FAMILY="JetBrainsMono Nerd Font"
FONT_SIZE=10          # pt, UI text (bar, rofi, dunst, GTK)
FONT_SIZE_TERM=12     # pt, terminal
ICON_FONT="Material Symbols Rounded"

# ── Shape + spacing scale (px) ──────────────────────────────────────────────
RADIUS=12             # corner radius everywhere (picom, eww, rofi, dunst)
SPACE_XS=4
SPACE_SM=8
SPACE_MD=12
SPACE_LG=16
SPACE_XL=24

# ── Opacity ─────────────────────────────────────────────────────────────────
BAR_OPACITY=0.88      # eww bar background
TERM_OPACITY=0.90     # kitty background

# ── GTK / Qt / cursor ───────────────────────────────────────────────────────
GTK_THEME=Materia-dark-compact
ICON_THEME=Papirus-Dark
CURSOR_THEME=Bibata-Modern-Classic
CURSOR_SIZE=24
