# ~/.config/lockscreen/lock.conf: everything about the lock screen in one place.
# Sourced by bash (KEY=value, no spaces around "="). Changes apply on the next
# lock; idle/suspend settings apply after `~/.config/lockscreen/idle.sh`
# (or an i3 restart, Super+Shift+R).
#
# Lock now:        Super+Escape   (or: ~/.config/lockscreen/lock.sh)
# Preview image:   ~/.config/lockscreen/lock.sh --preview   (renders, does NOT lock)
# Stuck?           Ctrl+Alt+F3, log in, run:  pkill -x i3lock-color   then Ctrl+Alt+F1/F2

# ── Background ──────────────────────────────────────────────────────────────
# Image to blur behind the lock. "desktop" = the current desktop wallpaper
# (from nitrogen); or a path. The wallpaper picker can set this for you.
LOCK_WALLPAPER="desktop"
# Blur strength (ImageMagick sigma; 0 = no blur, 8 = soft, 20 = very blurry)
BLUR=10
# Darken the image: 0 = unchanged, 100 = black
DIM=45

# ── Text ────────────────────────────────────────────────────────────────────
# Font for clock, date and info ("theme" = the rice font)
FONT="theme"
CLOCK_FORMAT="%H:%M"
DATE_FORMAT="%A, %d %B"
CLOCK_SIZE=120
DATE_SIZE=26
INFO_SIZE=18

# What to show under the clock (captured at lock time): yes / no
SHOW_MUSIC=yes        # artist – title, only if something is playing
SHOW_CPU=yes
SHOW_RAM=yes
SHOW_USER=yes         # "Locked · <user>" hint above the password ring

# Colors: "theme" follows ~/.config/theme (blue right now). To override, set
# RRGGBB values, e.g. ACCENT="1e88e5".
ACCENT="theme"        # clock + ring while typing
TEXT="theme"          # date + info text

# ── Automatic locking ───────────────────────────────────────────────────────
# Lock after this many minutes without keyboard/mouse (0 = never).
IDLE_MINUTES=10
# Turn the screen off this many minutes AFTER locking (0 = keep it on).
SCREEN_OFF_AFTER=5
# Lock before suspend / hibernate (lid close, `systemctl suspend`): yes / no
LOCK_ON_SUSPEND=yes
