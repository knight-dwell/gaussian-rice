; ~/.config/gammastep/config.ini: night light schedule used by the quick-settings
; "Night light" tile in Auto mode (~/.config/eww/scripts/quicksettings/nightlight.sh).
; Time-based (no location needed). Edit the times/temperatures freely.
[general]
temp-day=6500
temp-night=4200
fade=1
; evening: warm up gradually between these times; morning: back to neutral
dusk-time=18:30-19:30
dawn-time=06:00-07:00
adjustment-method=randr
